name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q --timeout=120 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-33" "build-tools;33.0.0"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Gradle 8.5
        run: |
          wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Compile Kotlin
        id: kotlin
        continue-on-error: true
        run: gradle compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee kotlin.log

      - name: Assemble APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log
          tail -50 assemble.log >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        run: |
          git config user.email "ci@bot" && git config user.name "CI"
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          cp kotlin.log assemble.log /tmp/ 2>/dev/null
          git checkout master -- kotlin.log assemble.log 2>/dev/null || cp /tmp/kotlin.log /tmp/assemble.log . 2>/dev/null
          git add kotlin.log assemble.log 2>/dev/null
          git commit -m "logs #${{ github.run_number }}" 2>/dev/null
          git push origin gh-pages --force 2>/dev/null
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@bot
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@bot

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nianan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
