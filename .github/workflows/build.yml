name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# 同一分支有新的push时取消旧的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          if [ -d "$ANDROID_HOME/platforms/android-33" ]; then
            echo "SDK cached, skip download"
          else
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd $ANDROID_HOME/cmdline-tools
            wget -q --timeout=120 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p latest
            shopt -s dotglob
            for f in *; do
              [ "$f" != "latest" ] && [ "$f" != "commandlinetools-linux-11076708_latest.zip" ] && mv "$f" latest/
            done
            shopt -u dotglob
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
              "platforms;android-33" "build-tools;33.0.0"
          fi

          # 在项目根目录写 local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle 8.5
        run: |
          if [ -d "gradle-8.5" ]; then
            echo "Gradle cached, skip download"
          else
            wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
          fi
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nianan-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
