name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Setup Gradle 8.5
        run: |
          if [ -d "gradle-8.5" ]; then
            echo "Gradle cached, skip download"
          else
            wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
          fi
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nianan-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
