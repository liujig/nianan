name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # 用系统预装的SDK，只补装需要的组件
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" 2>&1 || echo "SDK components may already exist"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Gradle 8.5
        run: |
          wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Compile Kotlin
        continue-on-error: true
        run: gradle compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee kotlin.log

      - name: Assemble APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          unset ANDROID_SDK_ROOT
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log

      - name: Upload logs to gh-pages
        if: always()
        run: |
          # 先备份所有文件（切分支会清空）
          cp kotlin.log assemble.log /tmp/ 2>/dev/null || true
          # 找APK
          APK=$(find app/build -name "*.apk" -type f 2>/dev/null | head -1)
          echo "APK found: $APK"
          if [ -n "$APK" ]; then cp "$APK" /tmp/app-debug.apk; fi
          # 切gh-pages
          git config user.email "ci@bot" && git config user.name "CI"
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          # 复制回来
          cp /tmp/kotlin.log /tmp/assemble.log /tmp/app-debug.apk . 2>/dev/null || true
          git add kotlin.log assemble.log app-debug.apk 2>/dev/null || true
          git commit -m "logs #${{ github.run_number }}" 2>/dev/null || true
          git push origin gh-pages --force 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nianan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
