name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Setup Gradle 8.5
        run: |
          wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          unset ANDROID_SDK_ROOT
          gradle assembleDebug --no-daemon --stacktrace

      - name: Create Release and Upload APK
        run: |
          set -e
          APK=$(find app/build -name "*.apk" -type f | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          cp "$APK" nianan-debug.apk
          
          # 创建tag
          TAG="build-${{ github.run_number }}"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          
          # 用GitHub CLI创建release
          gh release create "$TAG" nianan-debug.apk \
            --title "Build #${{ github.run_number }}" \
            --notes "APK $(date)" \
            --repo liujig/nianan \
            2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
