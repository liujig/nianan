name: Build APK

on:
  push:
    branches: [master, minimal-test]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q --timeout=120 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-33" "build-tools;33.0.0"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Gradle 8.5
        run: |
          wget -q --timeout=120 https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Find APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== ls outputs ==="
          find app/build/outputs -type f 2>/dev/null | head -20
          echo "=== Copy APK ==="
          APK=$(find . -path "*/apk/debug/*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" nianan-debug.apk
            ls -la nianan-debug.apk
          else
            echo "NO APK FOUND!"
            # 看gradle输出目录结构
            find app/build -maxdepth 4 -type d 2>/dev/null
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nianan-debug
          path: nianan-debug.apk
          retention-days: 7
